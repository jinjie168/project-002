<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fruit Lines</title>
<style>
:root{--n:3;--gold:#ffd36b;--mint:#3ee6b0}
*{-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:#fff;font-family:"Poppins","Segoe UI",system-ui,-apple-system,"PingFang SC",sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px;box-sizing:border-box;overflow-x:hidden;
background:radial-gradient(900px 700px at 10% -10%,#6a3df7 0%,transparent 60%),radial-gradient(800px 700px at 105% 5%,#ff4fa3 0%,transparent 55%),radial-gradient(900px 800px at 50% 115%,#14c4d8 0%,transparent 60%),#0c0a20;background-attachment:fixed}
body::before,body::after{content:"";position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.28;z-index:-1;animation:drift 18s ease-in-out infinite alternate}
body::before{background:#7c4dff;top:-15vmax;left:-12vmax}
body::after{background:#ff7ab8;bottom:-18vmax;right:-14vmax;animation-delay:-9s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
h1{margin:0}
#homeScreen{display:flex;flex-direction:column;align-items:center;gap:22px;margin-top:16vh}
#homeScreen h1{font-size:clamp(38px,9vw,60px);font-weight:800;letter-spacing:-1px;background:linear-gradient(90deg,#fff,#ffd36b 45%,#ff8ad1);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(255,140,200,.35))}
.hbig{display:flex;gap:14px;font-size:clamp(46px,12vw,72px)}
.hbig span{display:inline-block;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35));animation:float 3s ease-in-out infinite}
.hbig span:nth-child(2){animation-delay:-1s}.hbig span:nth-child(3){animation-delay:-2s}
@keyframes float{50%{transform:translateY(-14px) rotate(6deg)}}
#start,#ovb{position:relative;overflow:hidden;border:0;color:#fff;font:700 20px "Poppins",system-ui,sans-serif;padding:15px 44px;border-radius:999px;cursor:pointer;
background:linear-gradient(135deg,#7c4dff,#ff4fa3);box-shadow:0 10px 30px rgba(255,79,163,.45),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .2s,box-shadow .2s}
#start::after,#ovb::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3s infinite}
@keyframes shine{60%,100%{left:130%}}
#start:hover,#ovb:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 14px 38px rgba(255,79,163,.6),inset 0 1px 0 rgba(255,255,255,.4)}
#start:active,#ovb:active{transform:scale(.97)}
#newGame{display:none;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;font:600 15px "Poppins",system-ui,sans-serif;padding:10px 28px;border-radius:999px;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#newGame:hover{background:rgba(255,255,255,.18)}
#game{display:none;flex-direction:column;align-items:center;width:100%;padding-top:6px}
.bar{display:flex;gap:12px;align-items:center;justify-content:center;margin:0 0 12px;max-width:calc(100vw - 80px)}
.bar>span{display:flex;align-items:baseline;gap:8px;padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:rgba(255,255,255,.75);
background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 24px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.15)}
.bar b{font-size:22px;font-weight:800;color:#fff;letter-spacing:0;text-shadow:0 0 14px rgba(255,211,107,.6)}
.bar>span.low b{color:#ff6b81;text-shadow:0 0 14px rgba(255,80,110,.8);animation:pulse .9s infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
#homeBtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:5;width:46px;height:46px;border-radius:50%;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 20px rgba(0,0,0,.3);transition:transform .2s}
#homeBtn:hover{transform:scale(1.1)}#homeBtn:active{transform:scale(.94)}
#homeBtn img{width:30px;height:30px;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
#done{display:flex;gap:6px;margin-bottom:12px;font-size:20px;min-height:30px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
#done span{opacity:.3;filter:grayscale(1);transition:all .4s}
#done span.on{opacity:1;filter:none;transform:scale(1.2);text-shadow:0 0 14px var(--gold)}
#g{touch-action:none;user-select:none;-webkit-user-select:none;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;width:min(94vw,520px);padding:10px;box-sizing:border-box;border-radius:26px;
background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
box-shadow:0 30px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.3)}
#g.enter{animation:enter .55s cubic-bezier(.2,.9,.3,1.2)}
@keyframes enter{from{opacity:0;transform:translateY(24px) scale(.92)}}
.c{aspect-ratio:1;border:1px solid rgba(255,255,255,.14);border-radius:30%;font-size:calc(min(94vw,520px) / var(--n) * .52);padding:0;display:flex;align-items:center;justify-content:center;cursor:grab;color:#fff;
background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.05));box-shadow:0 4px 10px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .15s}
.c{text-shadow:0 3px 6px rgba(0,0,0,.35)}
@media (hover:hover){.c:hover{transform:translateY(-2px) scale(1.06)}}
.c.s{transform:scale(1.14);z-index:1;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 24px rgba(255,211,107,.7),0 10px 18px rgba(0,0,0,.35)}
.c.e{background:transparent;border:1px dashed rgba(255,255,255,.14);box-shadow:none;cursor:default}
.c.x{animation:burst .35s ease-in forwards;pointer-events:none}
@keyframes burst{35%{transform:scale(1.3) rotate(8deg);box-shadow:0 0 28px var(--gold);filter:brightness(1.6)}to{transform:scale(0) rotate(-20deg);opacity:0}}
#msg{display:none}
#g{position:relative}
#hand{position:absolute;z-index:4;pointer-events:none;line-height:1;filter:grayscale(1) brightness(2.4) drop-shadow(0 6px 10px rgba(0,0,0,.55));animation:handMove 2.4s ease-in-out infinite}
@keyframes handMove{0%{transform:translate(0,0) scale(1);opacity:0}12%{transform:translate(0,0) scale(.88);opacity:1}38%{transform:translate(var(--dx),var(--dy)) scale(.88);opacity:1}50%{transform:translate(var(--dx),var(--dy)) scale(.88);opacity:1}76%{transform:translate(0,0) scale(.88);opacity:1}100%{transform:translate(0,0) scale(1);opacity:0}}
.c.hint{border-color:#fff;animation:hintPulse 1.2s ease-in-out infinite}
@keyframes hintPulse{0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.7),0 0 16px rgba(255,255,255,.45)}50%{box-shadow:0 0 0 3px #fff,0 0 30px rgba(255,255,255,.85)}}
#tut{display:none;width:min(94vw,520px);box-sizing:border-box;margin-top:16px;padding:14px 18px;border-radius:20px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
#tut p{margin:6px 0;font-size:14px;line-height:1.4;color:rgba(255,255,255,.9)}
#tut b{display:inline-block;width:26px}
#ov{display:none;position:fixed;inset:0;background:rgba(8,6,24,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);align-items:center;justify-content:center;z-index:10;overflow:hidden}
#conf span{position:absolute;top:-12%;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(120vh) rotate(540deg)}}
#ov .card{position:relative;text-align:center;max-width:82vw;padding:30px 40px;border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.28);box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.4);animation:cardin .5s cubic-bezier(.2,.9,.3,1.3)}
@keyframes cardin{from{transform:scale(.6);opacity:0}}
#ov .big{font-size:68px;animation:float 1.6s ease-in-out infinite;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
#ov h2{margin:8px 0 6px;font-size:30px;font-weight:800;background:linear-gradient(90deg,#fff,#ffd36b);-webkit-background-clip:text;background-clip:text;color:transparent}
#ov p{margin:0 0 20px;opacity:.85;font-size:15px}
#ovb{background:linear-gradient(135deg,#17c9a0,#3ee6b0 60%,#8cf7d6);color:#06382c;box-shadow:0 10px 30px rgba(62,230,176,.45),inset 0 1px 0 rgba(255,255,255,.5);font-size:18px;padding:13px 36px}
#tut{flex-direction:column;gap:10px;padding:0;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.step{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.35;color:#fff;background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 26px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.25);animation:stepIn .45s cubic-bezier(.2,.9,.3,1.2);transition:opacity .4s,filter .4s}
.step i{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:14px;background:linear-gradient(135deg,#7c4dff,#ff4fa3);box-shadow:0 4px 12px rgba(255,79,163,.45)}
.step span{flex:1}
.step em{flex:none;font-style:normal;font-weight:800;color:#06382c;width:26px;height:26px;border-radius:50%;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,#17c9a0,#8cf7d6)}
.step.done{opacity:.55}.step.done em{display:flex}
@keyframes stepIn{from{opacity:0;transform:translateY(14px) scale(.96)}}
.bub{position:absolute;z-index:5;pointer-events:none;width:max-content;max-width:min(210px,70%);padding:10px 14px;border-radius:14px;font-size:13px;font-weight:600;line-height:1.35;color:#fff;background:linear-gradient(145deg,rgba(124,77,255,.95),rgba(255,79,163,.95));border:1px solid rgba(255,255,255,.4);box-shadow:0 10px 26px rgba(0,0,0,.45)}
.bub.pop{animation:stepIn .45s cubic-bezier(.2,.9,.3,1.2)}
</style></head><body>

<div id="done"></div>
<div id="g"></div>
<div id="msg"></div></div>
<div id="ov"><div id="conf"></div><div class="card"><div class="big" id="ovi">🎉</div><h2 id="ovt"></h2><p id="ovs"></p><button class="r" id="ovb"></button></div></div>
<script>
const E=['🍎','🍌','🍇','🍊','🍓','🍉','🍒','🥝','🍑'],PER=3,MAX=7*PER;
const Save={key:'fruitLines.v1',
  load(){try{return JSON.parse(localStorage.getItem(this.key))||{};}catch(e){return {};}},
  save(d){try{localStorage.setItem(this.key,JSON.stringify(d));}catch(e){}}};
let retry=false,timer,level=1,n=3,g,left,cleared,busy,over,start=null;
const $=id=>document.getElementById(id),G=$('g');
const fullLines=()=>{
  const out=[],K=[...Array(n).keys()];
  for(let r=0;r<n;r++){const v=g[r*n];if(v!==null&&K.every(c=>g[r*n+c]===v))out.push(K.map(c=>r*n+c));}
  for(let c=0;c<n;c++){const v=g[c];if(v!==null&&K.every(r=>g[r*n+c]===v))out.push(K.map(r=>r*n+c));}
  return out;
};
function shuffleSwap(){
  const a=Math.floor(Math.random()*n*n),r=Math.floor(a/n),c=a%n,opts=[];
  if(c<n-1)opts.push(a+1);
  if(r<n-1)opts.push(a+n);
  if(!opts.length)return false;
  const b=opts[Math.floor(Math.random()*opts.length)];
  if(g[a]===g[b])return false;
  [g[a],g[b]]=[g[b],g[a]];return true;
}
function init(){
  n=3+Math.floor((level-1)/PER);Save.save({level});
  document.documentElement.style.setProperty('--n',n);
  let perm,k=0;
  if(level===1){
    perm=[0,1,2];g=[2,0,2, 1,1,0, 1,0,2];left=8;
  }else{
    const stage=(level-1)%PER;
    perm=[...E.keys()].sort(()=>Math.random()-.5).slice(0,n);
    g=Array.from({length:n*n},(_,i)=>perm[Math.floor(i/n)]);
    const target=Math.round(n*n*(0.9+0.25*stage))+4;let guard=0;
    while((k<target||fullLines().length)&&guard++<20000){if(shuffleSwap())k++;}
    left=Math.ceil(k*(1.6-0.1*stage))+2;
  }
  cleared=new Set();busy=false;over=false;start=null;
  window._icons=perm;
  $('msg').textContent='';$('msg').style.color='';$('ov').style.display='none';clearTimeout(timer);
  draw();
  G.classList.remove('enter');void G.offsetWidth;G.classList.add('enter');
  tutReset();
}
function draw(){
  G.innerHTML='';
  g.forEach(v=>{const b=document.createElement('button');b.className='c'+(v===null?' e':'');b.textContent=v===null?'':E[v];G.appendChild(b);});
  $('left').textContent=left;$('lvl').textContent=level;$('left').parentElement.classList.toggle('low',left<=5);
  if(level===1&&!over&&!busy&&!fullLines().length)showHand();
  $('done').innerHTML=window._icons.map(k=>`<span class="${cleared.has(k)?'on':''}">${E[k]}</span>`).join('');
}
G.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.c');
  if(!el||busy||over)return;
  const idx=Array.prototype.indexOf.call(G.children,el);
  if(g[idx]===null)return;
  start={i:idx,x:e.clientX,y:e.clientY,w:el.offsetWidth,el};
  el.classList.add('s');
  try{G.setPointerCapture(e.pointerId);}catch(_){}
});
G.addEventListener('pointermove',e=>{
  if(!start)return;
  const dx=e.clientX-start.x,dy=e.clientY-start.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))<start.w*0.4)return;
  const a=start.i,r=Math.floor(a/n),c=a%n;
  let b;
  if(Math.abs(dx)>Math.abs(dy))b=dx>0?(c<n-1?a+1:-1):(c>0?a-1:-1);
  else b=dy>0?(r<n-1?a+n:-1):(r>0?a-n:-1);
  start.el.classList.remove('s');start=null;
  if(b<0||g[a]===g[b])return;
  [g[a],g[b]]=[g[b],g[a]];
  left--;tutDone(0);
  check();
});
['pointerup','pointercancel'].forEach(t=>G.addEventListener(t,()=>{if(start){start.el.classList.remove('s');start=null;}}));
function check(){
  const lines=fullLines();
  draw();
  if(lines.length){
    busy=true;tutDone(0);tutDone(1);
    lines.forEach(l=>{l.forEach(i=>G.children[i].classList.add('x'));cleared.add(g[l[0]]);});
    setTimeout(()=>{lines.forEach(l=>l.forEach(i=>{g[i]=null;}));busy=false;check();},350);
  }else end();
}
function end(){
  if(cleared.size===n){
    over=true;retry=false;tutDone(0);tutDone(1);tutDone(2);
    {const hh=$('hand');if(hh)hh.remove();document.querySelectorAll('.bub').forEach(b=>b.remove());}
    const last=level>=MAX;
    $('ovi').textContent=last?'🏆':'🎉';
    $('ovt').textContent=last?'You did it!':'Congratulations!';
    $('ovs').textContent=last?'All 21 levels cleared.':'Level '+level+' complete!';
    $('ovb').textContent=last?'Play again ▶':'Next level ▶';
    $('ov').style.display='flex';confetti();
    if(!last)timer=setTimeout(goNext,3500);
  }else if(left<=0){
    over=true;retry=true;
    $('ovi').textContent='😢';$('ovt').textContent='Out of moves';$('ovs').textContent='Give it another try!';$('ovb').textContent='Try again ▶';
    $('conf').innerHTML='';$('ov').style.display='flex';
  }
}
const STEPS=['Swipe a fruit to swap it with its neighbour','Fill a whole row or column with the same fruit to clear it','Clear every fruit before you run out of moves'];
let tutStep=0,lastShown=-1;
function tutReset(){tutStep=0;lastShown=-1;if(level===1)showHand();}
function tutDone(k){if(level===1&&tutStep===k)tutStep++;}
function solveMove(init){
  const N=n,K=[...Array(N).keys()];
  const lines=st=>{const out=[];
    for(let r=0;r<N;r++){const v=st[r*N];if(v!==null&&K.every(c=>st[r*N+c]===v))out.push(K.map(c=>r*N+c));}
    for(let c=0;c<N;c++){const v=st[c];if(v!==null&&K.every(r=>st[r*N+c]===v))out.push(K.map(r=>r*N+c));}
    return out;};
  const settle=st=>{st=st.slice();let l;while((l=lines(st)).length)l.forEach(x=>x.forEach(i=>{st[i]=null;}));return st;};
  const key=st=>st.map(v=>v===null?'.':v).join('');
  const s0=settle(init),seen=new Set([key(s0)]);
  let q=[{st:s0,first:null}];
  for(let d=0;d<9&&q.length;d++){
    const nq=[];
    for(const {st,first} of q){
      if(st.every(v=>v===null))return first;
      for(let a=0;a<N*N;a++){
        const r=Math.floor(a/N),c=a%N,nb=[];
        if(c<N-1)nb.push(a+1);
        if(r<N-1)nb.push(a+N);
        for(const b of nb){
          if(st[a]===st[b])continue;
          const t=st.slice();[t[a],t[b]]=[t[b],t[a]];
          const u=settle(t),k=key(u);
          if(!seen.has(k)){seen.add(k);nq.push({st:u,first:first||[a,b]});}
        }
      }
    }
    q=nq;
  }
  for(const {st,first} of q)if(st.every(v=>v===null))return first;
  return null;
}
function showHand(){
  const old=$('hand');if(old)old.remove();document.querySelectorAll('.bub').forEach(b=>b.remove());
  const best=solveMove(g);
  if(!best)return;
  const A=G.children[best[0]],B=G.children[best[1]];
  if(!A||!B)return;
  A.classList.add('hint');B.classList.add('hint');
  const h=document.createElement('div');h.id='hand';h.textContent='👆';
  h.style.fontSize=(A.offsetWidth*.8)+'px';
  G.appendChild(h);
  h.style.left=(A.offsetLeft+A.offsetWidth/2-h.offsetWidth/2)+'px';
  h.style.top=(A.offsetTop+A.offsetHeight/2-h.offsetHeight*.15)+'px';
  h.style.setProperty('--dx',(B.offsetLeft-A.offsetLeft)+'px');
  h.style.setProperty('--dy',(B.offsetTop-A.offsetTop)+'px');
  const k=Math.min(tutStep,STEPS.length-1);
  const bub=document.createElement('div');bub.className='bub'+(lastShown!==k?' pop':'');bub.textContent=STEPS[k];lastShown=k;
  G.appendChild(bub);
  const L=Math.min(A.offsetLeft,B.offsetLeft),R=Math.max(A.offsetLeft+A.offsetWidth,B.offsetLeft+B.offsetWidth);
  const T=Math.min(A.offsetTop,B.offsetTop),Bt=Math.max(A.offsetTop+A.offsetHeight,B.offsetTop+B.offsetHeight);
  let top=T-bub.offsetHeight-6;
  if(top<0)top=Bt+A.offsetHeight*.45;
  let left=(L+R)/2-bub.offsetWidth/2;
  left=Math.max(4,Math.min(G.clientWidth-bub.offsetWidth-4,left));
  bub.style.left=left+'px';bub.style.top=top+'px';
}
function confetti(){
  const c=$('conf');c.innerHTML='';
  const set=['🍎','🍌','🍇','🍊','🍓','✨','🎉'];
  for(let i=0;i<32;i++){const sp=document.createElement('span');sp.textContent=set[i%set.length];
    sp.style.left=Math.random()*100+'%';sp.style.animationDuration=(2.4+Math.random()*2.4)+'s';sp.style.animationDelay=(Math.random()*1.2)+'s';c.appendChild(sp);}
}
