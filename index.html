<div id="ov"><div id="conf"></div><div class="card"><div class="big" id="ovi">🎉</div><h2 id="ovt"></h2><p id="ovs"></p><button class="r" id="ovb"></button></div></div>
<script>
const E=['🍎','🍌','🍇','🍊','🍓','🍉','🍒','🥝','🍑'],PER=3,MAX=7*PER;
const Save={key:'fruitLines.v1',
  load(){try{return JSON.parse(localStorage.getItem(this.key))||{};}catch(e){return {};}},
  save(d){try{localStorage.setItem(this.key,JSON.stringify(d));}catch(e){}}};
const Snd={ctx:null,master:null,mus:null,sfx:null,sfxOn:true,musicOn:true,timer:null,next:0,step:0,
  CH:[[261.63,329.63,392,523.25,130.81],[220,261.63,329.63,440,110],[174.61,220,261.63,349.23,87.31],[196,246.94,293.66,392,98]],
  load(){try{this.sfxOn=localStorage.getItem('fruitLines.sfx')!=='off';this.musicOn=localStorage.getItem('fruitLines.music')!=='off';}catch(e){}},
  init(){
    if(!this.ctx){
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      const c=this.ctx=new AC();
      this.master=c.createGain();this.master.gain.value=1;this.master.connect(c.destination);
      this.mus=c.createGain();this.mus.gain.value=.35;this.mus.connect(this.master);
      this.sfx=c.createGain();this.sfx.gain.value=.8;this.sfx.connect(this.master);
    }
    if(this.ctx.state==='suspended')this.ctx.resume();
    if(this.musicOn)this.startMusic();
  },
  note(f,t,d,type,v,dest){
    const c=this.ctx,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05);
  },
  startMusic(){if(!this.ctx||this.timer)return;this.next=this.ctx.currentTime+.1;this.step=0;this.timer=setInterval(()=>this.sched(),100);},
  stopMusic(){clearInterval(this.timer);this.timer=null;},
  sched(){
    const c=this.ctx,e=.24;
    while(this.next<c.currentTime+.5){
      const s=this.step,ch=this.CH[Math.floor(s/8)%4],i=s%8,t=this.next;
      this.note(ch[[0,1,2,3,2,1,2,1][i]],t,.55,'triangle',.45,this.mus);
      if(i===0)ch.slice(0,3).forEach(f=>this.note(f,t,e*8,'triangle',.12,this.mus));
      if(i===0||i===4)this.note(ch[4],t,.7,'sine',.55,this.mus);
      if(i===6)this.note(ch[3]*2,t,.5,'sine',.14,this.mus);
      this.step++;this.next+=e;
    }
  },
  toggleSfx(){
    this.sfxOn=!this.sfxOn;
    try{localStorage.setItem('fruitLines.sfx',this.sfxOn?'on':'off');}catch(e){}
    if(this.sfxOn){this.init();this.click();}
  },
  toggleMusic(){
    this.musicOn=!this.musicOn;
    try{localStorage.setItem('fruitLines.music',this.musicOn?'on':'off');}catch(e){}
    if(this.musicOn)this.init();else this.stopMusic();
  },
  ok(){return this.ctx&&this.sfxOn;},
  tick(){if(!this.ok())return;this.note(900,this.ctx.currentTime,.06,'triangle',.25,this.sfx);},
  click(){if(!this.ok())return;this.note(660,this.ctx.currentTime,.08,'sine',.3,this.sfx);},
  swap(){
    if(!this.ok())return;
    const c=this.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();
    o.type='sine';o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(840,t+.1);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.16);
    o.connect(g);g.connect(this.sfx);o.start(t);o.stop(t+.2);
  },
  clear(k){
    if(!this.ok())return;const t=this.ctx.currentTime;
    [659.25,783.99,987.77,1318.5,1567.98].slice(0,k>1?5:4).forEach((f,i)=>{
      this.note(f,t+i*.07,.4,'sine',.4,this.sfx);this.note(f*2,t+i*.07,.25,'triangle',.12,this.sfx);
    });
  },
  win(){
    if(!this.ok())return;const t=this.ctx.currentTime;
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>this.note(f,t+i*.13,.45,'triangle',.45,this.sfx));
    [523.25,659.25,783.99,1046.5].forEach(f=>this.note(f,t+.6,1.4,'sine',.3,this.sfx));
    [1318.5,1567.98,2093].forEach((f,i)=>this.note(f,t+.7+i*.1,.6,'sine',.18,this.sfx));
  },
  lose(){
    if(!this.ok())return;const t=this.ctx.currentTime;
    [392,349.23,311.13,261.63].forEach((f,i)=>this.note(f,t+i*.22,.55,'triangle',.35,this.sfx));
  }};
document.addEventListener('visibilitychange',()=>{const c=Snd.ctx;if(!c)return;if(document.hidden)c.suspend();else c.resume();});
let retry=false,timer,level=1,n=3,g,left,cleared,busy,over,start=null;
const $=id=>document.getElementById(id),G=$('g');
const fullLines=()=>{
  const out=[],K=[...Array(n).keys()];
  for(let r=0;r<n;r++){const v=g[r*n];if(v!==null&&K.every(c=>g[r*n+c]===v))out.push(K.map(c=>r*n+c));}
  for(let c=0;c<n;c++){const v=g[c];if(v!==null&&K.every(r=>g[r*n+c]===v))out.push(K.map(r=>r*n+c));}
  return out;
};
function shuffleSwap(){
  const a=Math.floor(Math.random()*n*n),r=Math.floor(a/n),c=a%n,opts=[];
  if(c<n-1)opts.push(a+1);
  if(r<n-1)opts.push(a+n);
  if(!opts.length)return false;
  const b=opts[Math.floor(Math.random()*opts.length)];
  if(g[a]===g[b])return false;
  [g[a],g[b]]=[g[b],g[a]];return true;
}
function init(){
  n=3+Math.floor((level-1)/PER);Save.save({level});
  document.documentElement.style.setProperty('--n',n);
  let perm,k=0;
  if(level===1){
    perm=[0,1,2];g=[2,0,2, 1,1,0, 1,0,2];left=8;
  }else{
    const stage=(level-1)%PER;
    perm=[...E.keys()].sort(()=>Math.random()-.5).slice(0,n);
    g=Array.from({length:n*n},(_,i)=>perm[Math.floor(i/n)]);
    const target=Math.round(n*n*(0.9+0.25*stage))+4;let guard=0;
    while((k<target||fullLines().length)&&guard++<20000){if(shuffleSwap())k++;}
    left=Math.ceil(k*(1.6-0.1*stage))+2;
  }
  cleared=new Set();busy=false;over=false;start=null;
  window._icons=perm;
  $('msg').textContent='';$('msg').style.color='';$('ov').style.display='none';clearTimeout(timer);
  draw();
  const bw=$('bw');bw.classList.remove('enter');void bw.offsetWidth;bw.classList.add('enter');
  tutReset();
}
function draw(){
  G.innerHTML='';
  g.forEach(v=>{const b=document.createElement('button');b.className='c'+(v===null?' e':'');b.textContent=v===null?'':E[v];G.appendChild(b);});
  $('left').textContent=left;$('lvl').textContent=level;$('left').parentElement.classList.toggle('low',left<=5);
  if(level===1&&!over&&!busy&&!fullLines().length)showHand();
  $('done').innerHTML=window._icons.map(k=>`<span class="${cleared.has(k)?'on':''}">${E[k]}</span>`).join('');
}
G.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.c');
  if(!el||busy||over)return;
  const idx=Array.prototype.indexOf.call(G.children,el);
  if(g[idx]===null)return;
  start={i:idx,x:e.clientX,y:e.clientY,w:el.offsetWidth,el};
  el.classList.add('s');Snd.tick();
  try{G.setPointerCapture(e.pointerId);}catch(_){}
});
G.addEventListener('pointermove',e=>{
  if(!start)return;
  const dx=e.clientX-start.x,dy=e.clientY-start.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))<start.w*0.4)return;
  const a=start.i,r=Math.floor(a/n),c=a%n;
  let b;
  if(Math.abs(dx)>Math.abs(dy))b=dx>0?(c<n-1?a+1:-1):(c>0?a-1:-1);
  else b=dy>0?(r<n-1?a+n:-1):(r>0?a-n:-1);
  start.el.classList.remove('s');start=null;
  if(b<0||g[a]===g[b])return;
  [g[a],g[b]]=[g[b],g[a]];
  left--;tutDone(0);Snd.swap();
  check();
});
['pointerup','pointercancel'].forEach(t=>G.addEventListener(t,()=>{if(start){start.el.classList.remove('s');start=null;}}));
function check(){
  const lines=fullLines();
  draw();
  if(lines.length){
    busy=true;tutDone(0);tutDone(1);Snd.clear(lines.length);
    lines.forEach(l=>{l.forEach(i=>G.children[i].classList.add('x'));cleared.add(g[l[0]]);});
    setTimeout(()=>{lines.forEach(l=>l.forEach(i=>{g[i]=null;}));busy=false;check();},350);
  }else end();
}
function end(){
  if(cleared.size===n){
    over=true;retry=false;tutDone(0);tutDone(1);tutDone(2);Snd.win();
    {const hh=$('hand');if(hh)hh.remove();document.querySelectorAll('.bub').forEach(b=>b.remove());}
    const last=level>=MAX;
    $('ovi').textContent=last?'🏆':'🎉';
    $('ovt').textContent=last?'You did it!':'Congratulations!';
    $('ovs').textContent=last?'All 21 levels cleared.':'Level '+level+' complete!';
    $('ovb').textContent=last?'Play again ▶':'Next level ▶';
    $('ov').style.display='flex';confetti();
    if(!last)timer=setTimeout(goNext,3500);
  }else if(left<=0){
    over=true;retry=true;Snd.lose();
    $('ovi').textContent='😢';$('ovt').textContent='Out of moves';$('ovs').textContent='Give it another try!';$('ovb').textContent='Try again ▶';
    $('conf').innerHTML='';$('ov').style.display='flex';
  }
}
const STEPS=['Swipe a fruit to swap it with its neighbour','Fill a whole row or column with the same fruit to clear it','Clear every fruit before you run out of moves'];
let tutStep=0,lastShown=-1;
function tutReset(){tutStep=0;lastShown=-1;if(level===1)showHand();}
function tutDone(k){if(level===1&&tutStep===k)tutStep++;}
function solveMove(init){
  const N=n,K=[...Array(N).keys()];
  const lines=st=>{const out=[];
    for(let r=0;r<N;r++){const v=st[r*N];if(v!==null&&K.every(c=>st[r*N+c]===v))out.push(K.map(c=>r*N+c));}
    for(let c=0;c<N;c++){const v=st[c];if(v!==null&&K.every(r=>st[r*N+c]===v))out.push(K.map(r=>r*N+c));}
    return out;};
  const settle=st=>{st=st.slice();let l;while((l=lines(st)).length)l.forEach(x=>x.forEach(i=>{st[i]=null;}));return st;};
  const key=st=>st.map(v=>v===null?'.':v).join('');
  const s0=settle(init),seen=new Set([key(s0)]);
  let q=[{st:s0,first:null}];
  for(let d=0;d<9&&q.length;d++){
    const nq=[];
    for(const {st,first} of q){
      if(st.every(v=>v===null))return first;
      for(let a=0;a<N*N;a++){
        const r=Math.floor(a/N),c=a%N,nb=[];
        if(c<N-1)nb.push(a+1);
        if(r<N-1)nb.push(a+N);
        for(const b of nb){
          if(st[a]===st[b])continue;
          const t=st.slice();[t[a],t[b]]=[t[b],t[a]];
          const u=settle(t),k=key(u);
          if(!seen.has(k)){seen.add(k);nq.push({st:u,first:first||[a,b]});}
        }
      }
    }
    q=nq;
  }
  for(const {st,first} of q)if(st.every(v=>v===null))return first;
  return null;
}
function showHand(){
  const old=$('hand');if(old)old.remove();document.querySelectorAll('.bub').forEach(b=>b.remove());
  const best=solveMove(g);
  if(!best)return;
  const A=G.children[best[0]],B=G.children[best[1]];
  if(!A||!B)return;
  A.classList.add('hint');B.classList.add('hint');
  const h=document.createElement('div');h.id='hand';h.textContent='👆';
  h.style.fontSize=(A.offsetWidth*.8)+'px';
  G.appendChild(h);
  h.style.left=(A.offsetLeft+A.offsetWidth/2-h.offsetWidth/2)+'px';
  h.style.top=(A.offsetTop+A.offsetHeight/2-h.offsetHeight*.15)+'px';
  h.style.setProperty('--dx',(B.offsetLeft-A.offsetLeft)+'px');
  h.style.setProperty('--dy',(B.offsetTop-A.offsetTop)+'px');
  const k=Math.min(tutStep,STEPS.length-1);
  const bub=document.createElement('div');bub.className='bub'+(lastShown!==k?' pop':'');bub.textContent=STEPS[k];lastShown=k;
  G.appendChild(bub);
  const L=Math.min(A.offsetLeft,B.offsetLeft),R=Math.max(A.offsetLeft+A.offsetWidth,B.offsetLeft+B.offsetWidth);
  const T=Math.min(A.offsetTop,B.offsetTop),Bt=Math.max(A.offsetTop+A.offsetHeight,B.offsetTop+B.offsetHeight);
  let top=T-bub.offsetHeight-6;
  if(top<0)top=Bt+A.offsetHeight*.45;
  let left=(L+R)/2-bub.offsetWidth/2;
  left=Math.max(4,Math.min(G.clientWidth-bub.offsetWidth-4,left));
  bub.style.left=left+'px';bub.style.top=top+'px';
}
function confetti(){
  const c=$('conf');c.innerHTML='';
  const set=['🍎','🍌','🍇','🍊','🍓','✨','🎉'];
  for(let i=0;i<32;i++){const sp=document.createElement('span');sp.textContent=set[i%set.length];
    sp.style.left=Math.random()*100+'%';sp.style.animationDuration=(2.4+Math.random()*2.4)+'s';sp.style.animationDelay=(Math.random()*1.2)+'s';c.appendChild(sp);}
}
function goNext(){clearTimeout(timer);level=level>=MAX?1:level+1;init();}
$('ovb').onclick=()=>{Snd.click();if(retry){retry=false;clearTimeout(timer);init();}else goNext();};
function refreshHome(){
  const lv=Save.load().level||1;
  $('start').textContent=lv>1?'Continue':'Start Game';
  $('newGame').style.display=lv>1?'block':'none';
}
function play(lv){level=lv;$('homeScreen').style.display='none';$('game').style.display='flex';init();}
$('start').onclick=()=>{Snd.init();Snd.click();play(Save.load().level||1);};
$('newGame').onclick=()=>{Snd.init();Snd.click();Save.save({level:1});play(1);};
function goHome(){clearTimeout(timer);retry=false;$('ov').style.display='none';$('pm').style.display='none';$('game').style.display='none';$('homeScreen').style.display='flex';refreshHome();}
function updatePm(){$('pmSfx').classList.toggle('off',!Snd.sfxOn);$('pmMusic').classList.toggle('off',!Snd.musicOn);}
function openPm(){Snd.click();updatePm();$('pm').style.display='flex';}
function closePm(){$('pm').style.display='none';}
$('pauseBtn').onclick=openPm;
$('pmResume').onclick=()=>{Snd.click();closePm();};
$('pm').onclick=e=>{if(e.target.id==='pm')closePm();};
$('pmSfx').onclick=()=>{Snd.init();Snd.toggleSfx();updatePm();};
$('pmMusic').onclick=()=>{Snd.init();Snd.toggleMusic();updatePm();};
$('pmRestart').onclick=()=>{Snd.click();closePm();init();};
$('pmHome').onclick=()=>{Snd.click();goHome();};
Snd.load();
if(!(window.CSS&&CSS.registerProperty))document.documentElement.classList.add('fb');
function applyZoom(){document.documentElement.classList.toggle('sm',window.innerWidth/window.innerHeight<.6);}
applyZoom();
window.addEventListener('resize',applyZoom);
window.addEventListener('orientationchange',applyZoom);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));

refreshHome();
</script></body></html>
